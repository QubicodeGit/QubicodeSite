<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#061225">
  <meta name="robots" content="noindex,follow">
  <meta name="description" content="Page not found. Return to Qubicode games, tools, and digital worlds.">
  <title>Page not found — Qubicode</title>
  <base id="site-base" href="/">
  <script>
    // Resolve from the deployment root even when a host serves this file at a nested missing URL.
    (() => {
      const projectPath = "/QubicodeSite/";
      const isGitHubProject = location.hostname.toLowerCase() === "qubicodegit.github.io";
      const hasProjectPrefix = /^\/QubicodeSite(?:\/|$)/i.test(location.pathname);
      document.getElementById("site-base").href = location.protocol === "file:"
        ? new URL("./", location.href).href
        : (isGitHubProject || hasProjectPrefix ? projectPath : "/");
      document.documentElement.classList.add("js");
    })();
  </script>
  <link rel="icon" href="Images/qubicodeLogo.svg" type="image/svg+xml">
  <link rel="icon" href="Images/qubicodeLogo.ico" sizes="any">
  <link rel="stylesheet" href="style.css">
  <link rel="stylesheet" href="404.css">
  <link rel="stylesheet" href="motion.css">
</head>
<body class="not-found-page">
  <a class="skip-link" href="#main-content">Skip to content</a>
  <header class="site-header">
    <nav class="nav glass-panel" aria-label="Primary navigation">
      <a class="brand" href="./" aria-label="Qubicode home"><img src="Images/qubicodeLogo.svg" width="574" height="574" alt="" class="brand-logo" decoding="async"><span class="brand-wordmark">QUBICODE</span></a>
      <button class="nav-toggle" type="button" aria-expanded="false" aria-controls="nav-links"><span class="sr-only">Toggle navigation</span><span aria-hidden="true"></span><span aria-hidden="true"></span><span aria-hidden="true"></span></button>
      <ul class="nav-links" id="nav-links">
        <li><a href="./">Home</a></li><li><a href="./#games">Games</a></li><li><a href="./#contact">Contact</a></li>
      </ul>
      <a class="nav-discord glass-button" href="https://discord.gg/2PjpjMRh5N" target="_blank" rel="noopener" aria-label="Join Qubicode on Discord"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" stroke="none" d="M19.7 4.6a18.1 18.1 0 0 0-4.5-1.4l-.6 1.2a16.5 16.5 0 0 0-5.2 0l-.6-1.2a18.1 18.1 0 0 0-4.5 1.4C1.5 8.7.7 12.6 1.1 16.4a18 18 0 0 0 5.5 2.8l1.1-1.8-1.8-.9.5-.4a13.2 13.2 0 0 0 11.2 0l.5.4-1.8.9 1.1 1.8a18 18 0 0 0 5.5-2.8c.5-4.4-.8-8.3-3.2-11.8ZM8.2 13.9c-1.1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1Zm7.6 0c-1.1 0-1.9-1-1.9-2.1s.8-2.1 1.9-2.1 1.9 1 1.9 2.1-.8 2.1-1.9 2.1Z"/></svg><span>Join Discord</span></a>
    </nav>
  </header>

  <main class="not-found-main" id="main-content" tabindex="-1">
    <section class="not-found-scene" aria-labelledby="error-title">
      <div class="error-atmosphere" aria-hidden="true"><div class="error-ribbon"></div><div class="error-horizon"></div></div>
      <div class="section-inner error-grid">
        <div class="error-copy">
          <p class="error-number" aria-hidden="true">404</p>
          <h1 id="error-title">Page not found.</h1>
          <div class="error-actions">
            <a class="button button-primary" href="./"><svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="m3 11 9-8 9 8M5 9v12h5v-7h4v7h5V9"/></svg>Back to Home</a>
          </div>
        </div>
        <div class="hero-visual error-visual" aria-hidden="true">
          <div class="cube-aura"></div><div class="cube-floor"></div><div class="cube-shadow"></div>
          <div class="cube-reflection"><img src="Images/glass-cube.svg" width="440" height="420" alt="" decoding="async"></div>
          <div class="floating-cube"><img src="Images/glass-cube.svg" width="440" height="420" alt="" fetchpriority="high" decoding="async"></div>
          <div class="cube-contact-light"></div>
        </div>
      </div>
    </section>
  </main>

  <footer class="site-footer error-footer">
    <div class="section-inner footer-inner">
      <a class="brand footer-brand" href="./"><img src="Images/qubicodeLogo.svg" width="574" height="574" alt="" class="brand-logo" decoding="async"><span>QUBICODE</span></a>
      <p>&copy; <span id="year">2026</span> Qubicode. All rights reserved.</p>
      <nav class="error-footer-links" aria-label="Footer navigation"><a href="privacy/index.html">Privacy policy</a><a class="error-contact" href="./#contact">Get in touch<svg class="icon arrow-icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14m-5-5 5 5-5 5"/></svg></a></nav>
    </div>
  </footer>
  <script>
    (() => {
      const toggle = document.querySelector(".nav-toggle");
      const links = document.getElementById("nav-links");
      const nav = document.querySelector(".nav");
      const skipLink = document.querySelector(".skip-link");
      const currentPage = new URL(location.href);
      currentPage.hash = "main-content";
      skipLink.href = currentPage.href;
      document.getElementById("year").textContent = new Date().getFullYear();

      const closeMenu = () => {
        toggle.setAttribute("aria-expanded", "false");
        links.classList.remove("is-open");
        document.body.classList.remove("nav-open");
      };
      toggle.addEventListener("click", () => {
        const isOpen = toggle.getAttribute("aria-expanded") !== "true";
        toggle.setAttribute("aria-expanded", String(isOpen));
        links.classList.toggle("is-open", isOpen);
        document.body.classList.toggle("nav-open", isOpen);
      });
      links.addEventListener("click", (event) => {
        if (event.target.closest("a")) closeMenu();
      });
      document.addEventListener("click", (event) => {
        if (!nav.contains(event.target)) closeMenu();
      });
      document.addEventListener("keydown", (event) => {
        if (event.key === "Escape" && toggle.getAttribute("aria-expanded") === "true") {
          closeMenu();
          toggle.focus();
        }
      });
      nav.addEventListener("focusout", (event) => {
        if (!nav.contains(event.relatedTarget)) closeMenu();
      });
      window.matchMedia("(min-width: 821px)").addEventListener("change", closeMenu);
    })();
  </script>
</body>
</html>
