  <script>
    // A 404 is served at the missing URL, which may be several folders deep.
    // No relative assets are needed. Support both the repository path and a custom domain.
    (() => {
      const projectPath = "/QubicodeSite/";
      const base = location.pathname === projectPath.slice(0, -1) || location.pathname.startsWith(projectPath) ? projectPath : "/";
      document.querySelectorAll("[data-home]").forEach((link) => {
        link.href = base + link.dataset.home;
      });
      document.querySelector("#year").textContent = new Date().getFullYear();
    })();
