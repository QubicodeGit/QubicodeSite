<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 440 420" fill="none">
  <defs>
    <linearGradient id="qbg-top" x1="93" y1="133" x2="337" y2="49" gradientUnits="userSpaceOnUse">
