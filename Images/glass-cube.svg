    <linearGradient id="qbg-inner-top" x1="235" y1="169" x2="296" y2="60" gradientUnits="userSpaceOnUse">
      <stop stop-color="#91e5ff" stop-opacity=".5"/>
      <stop offset=".26" stop-color="#89aeff" stop-opacity=".05"/>
      <stop offset="1" stop-color="#e1cfff" stop-opacity=".34"/>
    </linearGradient>
    <linearGradient id="qbg-left-bottom" x1="94" y1="311" x2="191" y2="363" gradientUnits="userSpaceOnUse">
      <stop stop-color="#30ecff" stop-opacity=".52"/>
      <stop offset=".55" stop-color="#168dff" stop-opacity=".12"/>
