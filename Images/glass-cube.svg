    <radialGradient id="qbg-front-flare" cx="0" cy="0" r="1" gradientTransform="translate(220 202) rotate(90) scale(49 72)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d6ffff" stop-opacity=".83"/>
      <stop offset=".16" stop-color="#5ee8ff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#2285ff" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="qbg-cyan-glint" cx="0" cy="0" r="1" gradientTransform="translate(82 124) rotate(74) scale(60 21)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#d5ffff" stop-opacity=".76"/>
      <stop offset="1" stop-color="#31e9ff" stop-opacity="0"/>
    </radialGradient>
    <filter id="qbg-glow" x="-30%" y="-25%" width="160%" height="150%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="5"/>
    </filter>
    <filter id="qbg-frost" x="-20%" y="-20%" width="140%" height="140%" color-interpolation-filters="sRGB">
      <feGaussianBlur stdDeviation="1.8"/>
    </filter>
