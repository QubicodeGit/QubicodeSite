  <!-- The rear faces show through the glass and give the cube depth. -->
  <path d="M220 38V215L83 296L220 378L358 297L220 215" stroke="#6da1ff" stroke-opacity=".21" stroke-width="2" stroke-linejoin="round"/>
  <path d="M209 42V202L91 272V130Z" fill="#144898" fill-opacity=".18"/>
  <path d="M231 43V201L350 272V130Z" fill="#6580ed" fill-opacity=".14"/>
  <path d="M92 279L220 205L349 279L220 355Z" fill="#173a88" fill-opacity=".13"/>
  <path d="M84 130L208 204V363L87 290Z" fill="#104ec1" fill-opacity=".07"/>

  <!-- Broad translucent faces, inset facets, and bevels. -->
  <use href="#qbg-top-face" fill="url(#qbg-top)"/>
  <g clip-path="url(#qbg-top-clip)">
    <path d="M223 38L350 113L224 188Z" fill="url(#qbg-inner-top)"/>
    <path d="M218 40C210 46 211 68 211 98V171L226 187V56C226 46 222 43 218 40Z" fill="#15336f" fill-opacity=".41"/>
    <path d="M227 42L346 112L340 121L232 62Z" fill="#eff0ff" fill-opacity=".12"/>
    <path d="M88 113L208 182L219 188L229 180L222 195L212 195L86 122Z" fill="#91f4ff" fill-opacity=".24"/>
    <path d="M224 44L226 186" stroke="#a7b5ff" stroke-opacity=".33" stroke-width="2"/>
    <path d="M88 115L216 40" stroke="#06c9ff" stroke-opacity=".51" stroke-width="11" filter="url(#qbg-frost)"/>
  </g>
  <use href="#qbg-left-face" fill="url(#qbg-left)"/>
  <g clip-path="url(#qbg-left-clip)">
    <path d="M83 137L97 145L98 279L86 286Z" fill="#79ecff" fill-opacity=".17"/>
    <path d="M106 163L138 182V307L106 287Z" fill="#84bfff" fill-opacity=".11"/>
    <path d="M84 288L211 212V245L108 306Z" fill="#0a2156" fill-opacity=".48"/>
    <path d="M89 295L206 364L204 334L130 294L113 280Z" fill="url(#qbg-left-bottom)"/>
    <path d="M198 205L210 212V364L198 359Z" fill="#69a7ff" fill-opacity=".18"/>
    <path d="M85 293L205 365" stroke="#52dfff" stroke-opacity=".48" stroke-width="2"/>
  </g>
  <use href="#qbg-right-face" fill="url(#qbg-right)"/>
  <g clip-path="url(#qbg-right-clip)">
    <path d="M343 142L355 135V284L343 291Z" fill="#d2b6ff" fill-opacity=".19"/>
    <path d="M235 212L346 275L346 289L232 225Z" fill="#92a0ff" fill-opacity=".12"/>
    <path d="M232 250L329 308L232 368Z" fill="#101c5b" fill-opacity=".24"/>
    <path d="M233 372L350 301L339 282L291 315L233 347Z" fill="url(#qbg-right-bottom)"/>
    <path d="M234 213L245 206V354L233 366Z" fill="#82a8ff" fill-opacity=".15"/>
    <path d="M235 369L355 296" stroke="#f1d6ff" stroke-opacity=".43" stroke-width="2"/>
    <path d="M357 153V282" stroke="#bba0ff" stroke-opacity=".31" stroke-width="16" filter="url(#qbg-frost)"/>
  </g>

  <!-- A thick glass rim carries color below a fine white highlight. -->
  <g filter="url(#qbg-glow)" opacity=".72">
    <use href="#qbg-outline" stroke="url(#qbg-edge)" stroke-width="9"/>
    <path d="M80 118L209 195Q220 202 231 195L360 118M220 203V376" stroke="url(#qbg-edge)" stroke-width="8" stroke-linecap="round"/>
  </g>
  <use href="#qbg-outline" stroke="url(#qbg-edge)" stroke-opacity=".67" stroke-width="8"/>
  <use href="#qbg-outline" stroke="url(#qbg-edge)" stroke-width="2.4"/>
  <path d="M210 40Q220 34 230 40L349 110Q357 115 349 120L230 191Q220 197 210 191L91 120Q83 115 91 110Z" stroke="url(#qbg-rim-top)" stroke-width="1.4" stroke-opacity=".82"/>
  <path d="M84 129V284Q84 294 94 301L204 367Q209 370 209 362V217Q209 208 202 204L94 139" stroke="#4fceff" stroke-opacity=".59" stroke-width="2" stroke-linecap="round"/>
  <path d="M356 130V284Q356 294 346 301L236 367Q231 370 231 362V217Q231 208 238 204L346 139" stroke="#afaeff" stroke-opacity=".74" stroke-width="1.8" stroke-linecap="round"/>
  <path d="M80 117L209 195Q220 202 231 195L360 117" stroke="url(#qbg-rim-top)" stroke-width="6" stroke-opacity=".38" stroke-linecap="round"/>
  <path d="M80 116L210 193Q220 199 230 193L359 116" stroke="url(#qbg-rim-top)" stroke-width="1.9" stroke-linecap="round"/>
  <path d="M220 204V372" stroke="url(#qbg-center)" stroke-width="7" stroke-opacity=".24" stroke-linecap="round"/>
  <path d="M220 205V377" stroke="url(#qbg-center)" stroke-width="2.6" stroke-linecap="round"/>
  <path d="M78 127V280Q78 293 86 299" stroke="#abfbff" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".94"/>
  <path d="M231 35L353 108Q362 113 363 123V281Q363 293 356 299" stroke="#f5dcff" stroke-width="1.6" stroke-linecap="round" stroke-opacity=".94"/>
  <ellipse cx="220" cy="202" rx="72" ry="49" fill="url(#qbg-front-flare)"/>
  <ellipse cx="82" cy="125" rx="30" ry="62" fill="url(#qbg-cyan-glint)"/>
  <path d="M204 194L219 202L236 194M220 204V221" stroke="#c2ffff" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <path d="M80 119L94 126M343 104L355 111M219 372V378" stroke="#f1ffff" stroke-width="2" stroke-linecap="round" stroke-opacity=".85"/>
</svg>
