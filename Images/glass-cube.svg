      <stop offset=".57" stop-color="#6993ff" stop-opacity=".68"/>
      <stop offset="1" stop-color="#c5b4ff" stop-opacity=".88"/>
    </linearGradient>
    <linearGradient id="qbg-left" x1="77" y1="197" x2="233" y2="234" gradientUnits="userSpaceOnUse">
      <stop stop-color="#00d4ff" stop-opacity=".42"/>
      <stop offset=".24" stop-color="#0c80de" stop-opacity=".27"/>
      <stop offset=".72" stop-color="#134ec7" stop-opacity=".13"/>
      <stop offset="1" stop-color="#548cff" stop-opacity=".45"/>
    </linearGradient>
    <linearGradient id="qbg-right" x1="221" y1="262" x2="369" y2="273" gradientUnits="userSpaceOnUse">
      <stop stop-color="#3278ff" stop-opacity=".37"/>
      <stop offset=".45" stop-color="#2939a9" stop-opacity=".24"/>
      <stop offset=".82" stop-color="#a78aff" stop-opacity=".48"/>
      <stop offset="1" stop-color="#dbb6ff" stop-opacity=".79"/>
    </linearGradient>
    <linearGradient id="qbg-edge" x1="65" y1="207" x2="379" y2="213" gradientUnits="userSpaceOnUse">
      <stop stop-color="#5cf3ff"/>
      <stop offset=".43" stop-color="#228aff"/>
      <stop offset=".55" stop-color="#b5e8ff"/>
      <stop offset=".74" stop-color="#7083ff"/>
      <stop offset="1" stop-color="#efd3ff"/>
